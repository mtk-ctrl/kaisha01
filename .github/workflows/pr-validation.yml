name: PR Validation

on:
  pull_request:
    paths:
      - 'tanq-app/**'
      - '.github/workflows/pr-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tanq-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tanq-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tester session security checks
        run: node scripts/test-tester-session.mjs

      - name: Build
        env:
          TESTER_PIN: ci-test-pin
          TESTER_SESSION_SECRET: ci-test-secret-that-is-at-least-32-characters
          APP_ORIGIN: http://localhost:3000
        run: npm run build
